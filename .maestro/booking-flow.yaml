# End-to-end booking happy path, run locally against the iOS simulator.
#
# Prerequisites:
#   - hotels-api running at http://localhost:3000 with the demo seed data,
#     and migrated far enough to have bookings.is_synthetic (see hotels-api
#     migrations/..._add-is-synthetic-to-bookings.sql).
#   - POST /bookings now requires a real BetterAuth session (no more
#     anonymous/client-supplied userId), so this flow logs in as a
#     dedicated e2e account. Seed it ONCE against hotels-api, via
#     BetterAuth's own sign-up endpoint (not a raw SQL insert, so the
#     password hash matches what it expects at login):
#       curl -X POST http://localhost:3000/api/auth/sign-up/email \
#         -H "Content-Type: application/json" \
#         -d '{"email":"e2e@hotels.test","password":"e2e-test-pw!1","name":"E2E Test User"}'
#     Update E2E_EMAIL/E2E_PASSWORD below if you seed different credentials.
#   - A dev build installed on a booted simulator (`bun run ios` once), then
#     Metro serving the bundle with the e2e flag baked in:
#     `EXPO_PUBLIC_E2E_TEST_MODE=true bun start` on :8081. Without that env
#     var the app won't tag its booking as synthetic, and cleanup-booking.js
#     won't find anything to delete.
#   - Maestro CLI + idb-companion installed (see docs/logs/004-testing-setup.md).
#
# Run: `bun run test:e2e`  (or `maestro test .maestro/booking-flow.yaml`)
#
# SEARCH matches on hotel name OR location, so a city name works. Adjust it
# if your seed data differs.
appId: com.t-i-m-i.hotels
name: Book a hotel end-to-end
env:
  SEARCH: "Barcelona"
  API_URL: "http://localhost:3000"
  E2E_EMAIL: "e2e@hotels.test"
  E2E_PASSWORD: "e2e-test-pw!1"
---
# No `clearState`: on iOS that's implemented as a full uninstall/reinstall
# (see docs/logs/004-testing-setup.md), which wipes expo-dev-menu's "seen
# the dev menu" flag and brings back its one-time onboarding popover on
# every run. A plain launch still cold-restarts the app (fresh route stack,
# fresh in-memory state) which is all this flow needs - nothing we assert
# on depends on persisted local app data.
- launchApp

# expo-dev-client boots to its launcher menu; deep-link straight to the
# Metro bundle. For a physical device, swap localhost for your Mac's LAN IP.
# NOTE: appending a path here (e.g. ".../?url=http://localhost:8081/login")
# does NOT set the initial route - the dev client resolves it as a plain
# web request to Metro instead of a native deep link, which fails with
# "codegenNativeComponent is not a function" (react-native-web trying to
# load native-only modules). Keep this URL bare and navigate in-app instead.
- openLink:
    link: "hotels://expo-development-client/?url=http://localhost:8081"

# Defensive: dismiss expo-dev-menu's onboarding popover if it shows (e.g.
# on a genuinely fresh install) - it otherwise covers the hotel list below.
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- assertVisible:
    id: "hotel-card"

# Always end up signed in as the dedicated e2e account, regardless of
# whatever session already persisted in this simulator (no `clearState`,
# see note above) - your own dev login, a stale e2e session, or logged
# out. Go via the Account tab: log out first if something's already
# logged in (that flips it straight to the logged-out gate), then log
# back in as e2e. signIn.email overwrites the stored session either way.
- tapOn: "Account"
- runFlow:
    when:
      visible: "Logout"
    commands:
      - tapOn: "Logout"
- tapOn: "Login"
- tapOn:
    id: "email-input"
- inputText: "${E2E_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${E2E_PASSWORD}"
- tapOn:
    id: "login-button"
- assertNotVisible: "Login failed"

# iOS offers to save the just-submitted credentials to the system Password
# Manager - it's a system overlay, not app UI, and blocks every tap after
# it until dismissed.
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

# Explore -> Search. The search field is the pill in the bottom tab bar
# (iOS `role="search"` native tab); tapping it focuses the field.
- tapOn:
    id: "magnifyingglass"
- tapOn:
    point: "50%,95%"
- inputText: "${SEARCH}"
- assertVisible:
    id: "hotel-card"

# Open the first result.
- tapOn:
    id: "hotel-card"
    index: 0

# Hotel detail -> open the calendar bottom sheet.
- tapOn:
    id: "select-dates-button"
- assertVisible:
    id: "booking-calendar"

# Pick check-in / check-out on the 10th and 13th of next month. The sheet
# auto-closes once the range is complete.
- runScript: compute-dates.js
- tapOn:
    id: "booking-calendar.header.rightArrow"
- tapOn:
    id: "booking-calendar.day_${output.checkIn}"
- tapOn:
    id: "booking-calendar.day_${output.checkOut}"

# Confirm the booking.
- tapOn:
    id: "book-button"

# Redirected to My Bookings with the new booking highlighted. iOS merges
# BookingListItem's sibling Text nodes ("Booking confirmed!", hotel name,
# dates) into ONE accessibility label, comma-joined, since they sit inside
# an accessible Pressable (correct VoiceOver behavior, not a bug) - so the
# element's full text is "Booking confirmed!, <hotel>, <dates>", not just
# "Booking confirmed!". Maestro's text match is a full match, not a
# substring search, hence the trailing `.*` (same reason SEARCH below is
# wrapped in `.*...*`).
- extendedWaitUntil:
    visible: "Booking confirmed!.*"
    timeout: 20000
- assertVisible: ".*${SEARCH}.*"

# This just created a real booking in the shared demo database, tagged
# synthetic by the app itself (EXPO_PUBLIC_E2E_TEST_MODE, see client.ts) —
# sweep it up via the backend's bulk-delete-synthetic endpoint.
- runScript: cleanup-booking.js
